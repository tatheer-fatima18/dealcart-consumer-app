#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M

#Gradle
org.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=1024M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

org.jetbrains.compose.experimental.jscanvas.enabled=true

kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true

#iOS/Xcode
kotlin.apple.xcodeCompatibility.nowarn=true